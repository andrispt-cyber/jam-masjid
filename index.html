function correctedTime(n){const raw=String(effectiveTimes()[n]||'00:00').split(':').map(Number);const base=(raw[0]||0)*60+(raw[1]||0);const delta=Math.max(-60,Math.min(60,Number(settings.offsetMinutes?.[n])||0));const m=((base+delta)%1440+1440)%1440;return fmt(Math.floor(m/60))+':'+fmt(m%60)}
function render(){ $('middle').classList.toggle('with-side',!!settings.sidePanelEnabled);$('sidepanel').textContent=settings.sidePanelText||''; $('name').textContent=settings.masjid;$('location').textContent=settings.location;$('prayers').title=settings.scheduleMode==='kemenag'?(kemenagTimes&&kemenagDay===jakartaDay()?'Jadwal resmi Kemenag + koreksi DKM':kemenagError||'Menunggu data resmi'):'Jadwal manual DKM';$('notice').textContent=settings.scheduleMode==='kemenag'?(kemenagTimes&&kemenagDay===jakartaDay()?'KEMENAG '+kemenagDay:(kemenagError||'MENUNGGU DATA KEMENAG')):'JADWAL MANUAL';$('prayers').innerHTML=NAMES.map(n=>'<div class="prayer"><span>'+({subuh:'Subuh',terbit:'Terbit',zuhur:'Zuhur',asar:'Asar',magrib:'Magrib',isya:'Isya'}[n])+'</span><strong>'+escapeHtml(correctedTime(n))+'</strong></div>').join('');$('annText').textContent='✦ '+settings.announcement+' ✦ '+settings.announcement;$('announce').style.setProperty('--duration',(settings.announcementSpeed||120)+'s');$('announce').style.setProperty('--font',(settings.announcementFont||34)+'px');$('kajian').style.setProperty('--duration',(settings.kajianSpeed||150)+'s');$('kajian').style.setProperty('--font',(settings.kajianFont||34)+'px');renderMedia();renderKajian();tick();}
function renderKajian(){const now=clockParts(),sundays=[];for(let d=1;d<=new Date(now.year,now.month,0).getDate();d++)if(new Date(now.year,now.month-1,d).getDay()===0)sundays.push(d);let lines=[];sundays.forEach((d,w)=>{[0,1].forEach(t=>{const k=settings.kajian[w*2+t];if(k?.title)lines.push('MINGGU KE-'+(w+1)+' • AHAD '+(t?'MALAM':'PAGI')+' '+fmt(d)+'/'+fmt(now.month)+' • '+(t&&k.title?k.title+' • ':'')+'PEMATERI: '+(k.speaker||'Belum ditetapkan'))})});$('kajText').textContent=lines.join('     ✦     ')||'Informasi kajian rutin belum diatur';}
function tick(){const now=new Date(),p=clockParts(),sec=p.hour*3600+p.minute*60+p.second;$('clock').textContent=[p.hour,p.minute,p.second].map(fmt).join(':');$('date').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);try{$('hijri').textContent=new Intl.DateTimeFormat('id-ID-u-ca-islamic',{timeZone:'Asia/Jakarta',day:'numeric',month:'long',year:'numeric'}).format(now)+' H (perkiraan)'}catch(e){}
let arr=NAMES.filter(n=>n!=='terbit').map(n=>({n,s:seconds(correctedTime(n))})),future=arr.map(x=>({...x,delta:(x.s-sec+86400)%86400})).sort((a,b)=>a.delta-b.delta),next=future[0];let iq=arr.find(x=>{const elapsed=(sec-x.s+86400)%86400;return elapsed<(settings.iqamahTimes[x.n]||0)*60});if(iq){next={n:iq.n,delta:(settings.iqamahTimes[iq.n]||0)*60-((sec-iq.s+86400)%86400)};$('next').textContent='Iqamah '+iq.n.toUpperCase()}else{$('next').textContent=next.n.toUpperCase()+' — '+correctedTime(next.n)}
$('count').textContent=[Math.floor(next.delta/3600),Math.floor(next.delta%3600/60),next.delta%60].map(fmt).join(':');let dark=!!settings.blackoutEnabled&&arr.some(x=>{const start=(x.s+(settings.iqamahTimes[x.n]||0)*60)%86400;return (sec-start+86400)%86400<(settings.blackoutDuration||15)*60});$('blackout').classList.toggle('active',dark);}
if(db){$('notice').textContent='Menghubungkan…';db.ref('masjid/public').on('value',snap=>{connected=true;settings=cleanData(snap.val()||DEFAULTS);$('notice').textContent=snap.exists()?'':'Belum ada data: simpan dari halaman admin';render();refreshKemenag()},err=>{$('notice').textContent='Koneksi database gagal';console.error(err)})}else{$('notice').textContent='Firebase belum dikonfigurasi';render()}
setInterval(tick,1000);setInterval(renderKajian,60000);setInterval(refreshKemenag,60000);tick();

/* Panel kanan: tabel, dokumen, jadwal khotib berganti 30 detik */
let panelLastKey='',panelLastSlide=-1;
function panelMoney(n){return 'Rp '+(Number(n)||0).toLocaleString('id-ID',{maximumFractionDigits:0})}
function panelEscape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderFinancePanel(){
 const host=$('sidepanel');if(!host||!settings.sidePanelEnabled)return;
 const c=settings.financePanel||{},slides=['table','document','friday'];
 const slide=slides[Math.floor(Date.now()/30000)%3];const j=settings.fridaySchedule||{};
 const key=JSON.stringify(c)+'|'+JSON.stringify(j)+'|'+slide;
 if(key===panelLastKey)return;panelLastKey=key;
 const title=panelEscape(c.title||'Laporan Keuangan Masjid');
 const opening=Number(c.opening)||0,income=Number(c.income)||0,expense=Number(c.expense)||0,ending=opening+income-expense;
 let html='<div class="panel-slide">';
 if(slide==='table'){
  html+='<h2 class="finance-title">'+title+'</h2><table><tr><td>Saldo awal</td><td>'+panelMoney(opening)+'</td></tr><tr><td>Pemasukan</td><td>'+panelMoney(income)+'</td></tr><tr><td>Pengeluaran</td><td>'+panelMoney(expense)+'</td></tr><tr class="panel-total"><td>Saldo akhir</td><td>'+panelMoney(ending)+'</td></tr></table>';
 }else if(slide==='document'){
  html+='<h2>Dokumen / Gambar Laporan</h2><div class="panel-document" id="panelDocument"></div>';
 }else{
  const p=clockParts(),currentMonth=p.year+'-'+fmt(p.month);
  const rows=(j.month===currentMonth&&Array.isArray(j.rows)?j.rows:[]).filter(r=>r&&r.date&&r.name).slice().sort((a,b)=>a.date.localeCompare(b.date));
  html+='<div class="friday-heading"><h2>Jadwal Khotib Jumat '+panelEscape(new Intl.DateTimeFormat('id-ID',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(p.year,p.month-1,1))))+'</h2></div>';
  if(!rows.length)html+='<p>Jadwal khotib bulan ini belum diisi oleh DKM.</p>';
  else {html+='<div class="friday-table-wrap"><table class="friday-table"><thead><tr><th>Tanggal</th><th>Khotib</th><th>Muadzin</th></tr></thead><tbody>';for(const r of rows){html+='<tr><td>'+panelEscape(r.date.slice(8,10))+'/'+panelEscape(r.date.slice(5,7))+'</td><td>'+panelEscape(r.name)+'</td><td>'+panelEscape(r.muadzin||'—')+'</td></tr>'}html+='</tbody></table></div>'}
 }
 html+='</div>';host.innerHTML=html;
 if(slide==='document'){const box=host.querySelector('#panelDocument'),url=String(c.documentUrl||'').trim();if(!/^https:\/\//i.test(url)){box.textContent='Belum ada URL PDF atau gambar. Atur melalui Admin DKM.';}else if(/\.pdf(?:[?#]|$)/i.test(url)){const f=document.createElement('iframe');f.src=url;f.title='PDF laporan keuangan';box.appendChild(f);}else{const img=document.createElement('img');img.src=url;img.alt='Gambar laporan keuangan';img.onerror=()=>{box.textContent='Gambar tidak dapat dibuka. Periksa URL publik.'};box.appendChild(img);}}
}
const oldFinanceRender=render;render=function(){oldFinanceRender();panelLastKey='';renderFinancePanel()};
setInterval(renderFinancePanel,1000);
setInterval(renderMedia,1000);
</script></body></html>
