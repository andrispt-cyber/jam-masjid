<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jam Digital Masjid | TV</title><style>*{box-sizing:border-box}body{margin:0;background:#071d19;color:#fff;font-family:Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;background:#e6bd65;color:#18352d;padding:11px 17px;font-weight:bold}button:disabled{opacity:.45}input,textarea,select{width:100%;padding:9px;border:1px solid #9db7aa;border-radius:7px;background:#fff;color:#152c24}label{display:block;font-size:14px;margin:8px 0}h1,h2,h3{color:#f2d183}small,.muted{color:#c1d2c8}.status{padding:10px;background:#244f43;border-radius:8px;margin:10px 0}.error{background:#682c2c}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.box{background:#123d32;border:1px solid #397966;border-radius:14px;padding:18px;margin:12px 0}
body{height:100dvh;overflow:hidden;display:flex;flex-direction:column}header{height:9vh;min-height:65px;text-align:center;background:#103e32;border-bottom:2px solid #dfb75e;padding:5px}header h1{font-family:Georgia,serif;font-size:clamp(24px,2.7vw,52px);letter-spacing:.05em;margin:0;text-shadow:0 2px 10px #000}header p{margin:1px;font-size:clamp(12px,1.1vw,20px)}main{height:91vh;display:flex;flex-direction:column;gap:1vh;padding:1vh 1vw}.top{height:16%;display:grid;grid-template-columns:1.4fr 1fr;gap:1vw}.top>div{background:#113d33;border:1px solid #377c66;border-radius:12px;display:flex;flex-direction:column;justify-content:center;align-items:center}.clock{font-size:clamp(40px,5.4vw,110px);font-weight:800;line-height:1.04;font-variant-numeric:tabular-nums}.date{color:#f1d58e;font-size:clamp(12px,1.2vw,23px);text-align:center}.count{font-size:clamp(28px,3vw,65px);font-weight:bold}.next{color:#f1d58e;font-size:clamp(14px,1.6vw,28px)}.media{position:relative;flex:1;min-height:0;border:2px solid #d7b65e;border-radius:15px;overflow:hidden;background:#0b2821}.media img,.media video,.media iframe{width:100%;height:100%;object-fit:contain;border:0}.media iframe{background:#080808}.media .textmedia{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:4vw;font-size:clamp(28px,4vw,75px);font-weight:bold;white-space:pre-wrap}.medialabel{position:absolute;top:8px;left:8px;background:#0b3e33dd;color:#ffdd8c;padding:7px 14px;border-radius:8px;font-weight:bold;font-size:15px;pointer-events:none}.prayers{height:11%;display:grid;grid-template-columns:repeat(6,1fr);gap:.5vw}.prayer{background:#145042;border:1px solid #42866e;border-radius:9px;text-align:center;display:flex;flex-direction:column;justify-content:center;font-size:clamp(12px,1.35vw,24px)}.prayer strong{font-size:clamp(18px,2vw,37px)}.ticker{height:5%;min-height:32px;overflow:hidden;white-space:nowrap;display:flex;align-items:center;background:#e1bd63;color:#16352a;border-radius:6px;font-weight:800}.ticker.kajian{background:#174c3f;color:#ffdd8c}.ticker span{display:inline-block;white-space:nowrap;padding-left:100%;animation:marquee var(--duration,120s) linear infinite;font-size:var(--font,34px)}@keyframes marquee{to{transform:translateX(-100%)}}#blackout{display:none;position:fixed;inset:0;background:#000;z-index:1000}#blackout.active{display:block}#notice{position:absolute;top:8px;right:10px;font-size:12px;color:#ffda87;background:#102b24aa;padding:4px 7px;border-radius:5px} @media(max-width:650px){.top{grid-template-columns:1fr 1fr}.prayers{gap:2px}.prayer{font-size:11px}.prayer strong{font-size:14px}}
.middle{display:flex;flex:1;min-height:0;gap:1vw}.middle .media{flex:1;min-width:0}.sidepanel{display:none;width:29%;min-width:0;background:#164d40;border:2px solid #d7b65e;border-radius:15px;padding:2vw;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;font-size:clamp(18px,1.7vw,34px);line-height:1.35}.middle.with-side .sidepanel{display:block}.middle.with-side .media{flex:1}
.media-stage img,
.media img,
#masjidFoto {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center center;
}

/* Perbaikan layout TV: setiap baris memiliki ruang sendiri */
main{height:auto;flex:1;min-height:0;box-sizing:border-box}
.top{height:auto;flex:0 0 23%;min-height:0}
.top>div{min-height:0;overflow:hidden;padding:5px 8px}
.clock{font-size:clamp(36px,5vw,96px);line-height:1}
.date{font-size:clamp(12px,1.05vw,21px);line-height:1.15}
.count{font-size:clamp(26px,2.7vw,58px);line-height:1.05}
.next{font-size:clamp(13px,1.4vw,25px)}
.middle{height:auto;flex:1 1 0;min-height:0;align-items:stretch}
.middle .media{height:100%;min-height:0}
.middle .media img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.sidepanel{height:100%;box-sizing:border-box}
.prayers{height:auto;flex:0 0 12%;min-height:0}

@media(max-height:650px){.top{flex-basis:25%}.clock{font-size:clamp(32px,4.4vw,76px)}.date{font-size:clamp(11px,.95vw,17px)}}

/* Header: judul dan alamat selalu di atas garis pembatas */
header{height:auto;min-height:0;flex:0 0 12%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 12px;overflow:hidden}
header h1{font-size:clamp(23px,min(2.7vw,4.2vh),52px);line-height:1.05;margin:0}
header p{font-size:clamp(12px,min(1.1vw,2.2vh),20px);line-height:1.15;margin:0;max-width:100%;text-align:center}
main{height:auto;flex:1;min-height:0}
@media(max-height:650px){header{flex-basis:13%}header h1{font-size:clamp(20px,3.6vh,38px)}header p{font-size:clamp(11px,1.9vh,17px)}}

/* Meratakan kotak ke sisi kiri dan kanan */
main {
  width: 100% !important;
  max-width: none !important;
  margin-left: 0 !important;
  margin-right: 0 !important;
  padding-left: 0 !important;
  padding-right: 0 !important;
  box-sizing: border-box;
}

.top,
.middle,
.prayers,

  box-sizing: border-box;

</style></head><body><header><h1 id="name">MASJID AL-BARKAH</h1><p id="location">Pondok Kelapa, Duren Sawit, Jakarta Timur</p></header><main><div class="top"><div><div class="clock" id="clock">00:00:00</div><div class="date" id="date"></div><div class="date" id="hijri"></div></div><div><div>Menuju Waktu Salat</div><div class="next" id="next">—</div><div class="count" id="count">00:00:00</div></div></div><div class="middle" id="middle"><div class="media" id="media"><div class="medialabel" id="medialabel">FOTO MASJID</div><div id="notice"></div></div><aside class="sidepanel" id="sidepanel"></aside></div><div class="prayers" id="prayers"></div><div class="ticker" id="announce"><span id="annText"></span></div><div class="ticker kajian" id="kajian"><span id="kajText"></span></div></main><div id="blackout"></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const NAMES=['subuh','terbit','zuhur','asar','magrib','isya'];
const DEFAULTS={masjid:'MASJID AL-BARKAH',location:'Pondok Kelapa, Duren Sawit, Jakarta Timur',times:{subuh:'04:25',terbit:'05:38',zuhur:'11:42',asar:'14:57',magrib:'17:50',isya:'19:02'},iqamahTimes:{subuh:8,zuhur:10,asar:10,magrib:5,isya:10},blackoutEnabled:false,blackoutDuration:15,sidePanelEnabled:false,sidePanelText:'Informasi DKM\n\nSilakan isi melalui halaman admin.',announcement:'Selamat datang di masjid • Jagalah kebersihan dan ketertiban',announcementSpeed:120,kajianSpeed:150,announcementFont:34,kajianFont:34,media:{mode:'photo',url:'',text:'Selamat datang di masjid'},kajian:Array.from({length:10},(_,i)=>({time:i%2?'19:30':'07:00',title:i%2?'Kajian Ahad Malam':'Kajian Ahad Pagi',speaker:''}))};
const $=id=>document.getElementById(id);
const configured=!!(window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&!window.FIREBASE_CONFIG.apiKey.startsWith('GANTI_'));
let db=null;if(configured){try{firebase.initializeApp(window.FIREBASE_CONFIG);db=firebase.database()}catch(e){console.error(e)}}
function cleanData(v){return {...DEFAULTS,...v,times:{...DEFAULTS.times,...(v?.times||{})},iqamahTimes:{...DEFAULTS.iqamahTimes,...(v?.iqamahTimes||{})},media:{...DEFAULTS.media,...(v?.media||{})},kajian:Array.from({length:10},(_,i)=>({...DEFAULTS.kajian[i],...(v?.kajian?.[i]||{})}))}}
function fmt(s){return String(s).padStart(2,'0')}
function clockParts(){let p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Jakarta',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());return Object.fromEntries(p.filter(x=>x.type!=='literal').map(x=>[x.type,+x.value]))}
function seconds(t){const a=String(t||'00:00').split(':').map(Number);return a[0]*3600+a[1]*60}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
</script>
<script>
let settings=cleanData(DEFAULTS);let connected=false;let currentMediaKey='';
function renderMedia(){let cfg=settings.media||{},key=JSON.stringify(cfg);if(key===currentMediaKey)return;currentMediaKey=key;const host=$('media');host.querySelectorAll('img,iframe,video,.textmedia,.fallback').forEach(x=>x.remove());let mode=cfg.mode||'photo',node;
if(mode==='text'){node=document.createElement('div');node.className='textmedia';node.textContent=cfg.text||'Selamat datang di masjid'}
else if(mode==='youtube'){const m=String(cfg.url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/))([A-Za-z0-9_-]{11})/);if(m){node=document.createElement('iframe');node.src='https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1&mute=1&playsinline=1';node.allow='autoplay;encrypted-media;picture-in-picture;fullscreen';node.allowFullscreen=true;node.referrerPolicy='strict-origin-when-cross-origin'}else{node=document.createElement('div');node.className='textmedia';node.textContent='URL YouTube tidak valid'}}
else if(mode==='video'){node=document.createElement('video');node.src=cfg.url||'';node.autoplay=true;node.loop=true;node.muted=true;node.playsInline=true;node.controls=false;node.onerror=()=>{node.replaceWith(fallback('Video tidak dapat diputar'))}}
else{node=document.createElement('img');node.src=cfg.url||'masjid.jpg';node.onerror=()=>{if(node.src.endsWith('/masjid.jpg'))node.replaceWith(fallback('Foto masjid belum tersedia'));else node.src='masjid.jpg'}}
node.classList?.add('mediacontent');host.appendChild(node);$('medialabel').textContent=({photo:'FOTO MASJID',video:'VIDEO',youtube:'LIVE / YOUTUBE',text:'INFORMASI MASJID'})[mode]||'MULTIMEDIA';}
function fallback(t){let x=document.createElement('div');x.className='textmedia fallback';x.textContent=t;return x}
function render(){ $('middle').classList.toggle('with-side',!!settings.sidePanelEnabled);$('sidepanel').textContent=settings.sidePanelText||''; $('name').textContent=settings.masjid;$('location').textContent=settings.location;$('prayers').innerHTML=NAMES.map(n=>'<div class="prayer"><span>'+({subuh:'Subuh',terbit:'Terbit',zuhur:'Zuhur',asar:'Asar',magrib:'Magrib',isya:'Isya'}[n])+'</span><strong>'+escapeHtml(settings.times[n])+'</strong></div>').join('');$('annText').textContent='✦ '+settings.announcement+' ✦ '+settings.announcement;$('announce').style.setProperty('--duration',(settings.announcementSpeed||120)+'s');$('announce').style.setProperty('--font',(settings.announcementFont||34)+'px');$('kajian').style.setProperty('--duration',(settings.kajianSpeed||150)+'s');$('kajian').style.setProperty('--font',(settings.kajianFont||34)+'px');renderMedia();renderKajian();tick();}
function renderKajian(){const now=clockParts(),sundays=[];for(let d=1;d<=new Date(now.year,now.month,0).getDate();d++)if(new Date(now.year,now.month-1,d).getDay()===0)sundays.push(d);let lines=[];sundays.forEach((d,w)=>{[0,1].forEach(t=>{const k=settings.kajian[w*2+t];if(k?.title)lines.push('MINGGU KE-'+(w+1)+' • AHAD '+(t?'MALAM':'PAGI')+' '+fmt(d)+'/'+fmt(now.month)+' • '+k.time+' WIB • '+k.title+(k.speaker?' • '+k.speaker:''))})});$('kajText').textContent=lines.join('     ✦     ')||'Informasi kajian rutin belum diatur';}
function tick(){const now=new Date(),p=clockParts(),sec=p.hour*3600+p.minute*60+p.second;$('clock').textContent=[p.hour,p.minute,p.second].map(fmt).join(':');$('date').textContent=new Intl.DateTimeFormat('id-ID',{timeZone:'Asia/Jakarta',weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(now);try{$('hijri').textContent=new Intl.DateTimeFormat('id-ID-u-ca-islamic',{timeZone:'Asia/Jakarta',day:'numeric',month:'long',year:'numeric'}).format(now)+' H (perkiraan)'}catch(e){}
let arr=NAMES.filter(n=>n!=='terbit').map(n=>({n,s:seconds(settings.times[n])})),future=arr.map(x=>({...x,delta:(x.s-sec+86400)%86400})).sort((a,b)=>a.delta-b.delta),next=future[0];let iq=arr.find(x=>{const elapsed=(sec-x.s+86400)%86400;return elapsed<(settings.iqamahTimes[x.n]||0)*60});if(iq){next={n:iq.n,delta:(settings.iqamahTimes[iq.n]||0)*60-((sec-iq.s+86400)%86400)};$('next').textContent='Iqamah '+iq.n.toUpperCase()}else{$('next').textContent=next.n.toUpperCase()+' — '+settings.times[next.n]}
$('count').textContent=[Math.floor(next.delta/3600),Math.floor(next.delta%3600/60),next.delta%60].map(fmt).join(':');let dark=!!settings.blackoutEnabled&&arr.some(x=>{const start=(x.s+(settings.iqamahTimes[x.n]||0)*60)%86400;return (sec-start+86400)%86400<(settings.blackoutDuration||15)*60});$('blackout').classList.toggle('active',dark);}
if(db){$('notice').textContent='Menghubungkan…';db.ref('masjid/public').on('value',snap=>{connected=true;settings=cleanData(snap.val()||DEFAULTS);$('notice').textContent=snap.exists()?'':'Belum ada data: simpan dari halaman admin';render()},err=>{$('notice').textContent='Koneksi database gagal';console.error(err)})}else{$('notice').textContent='Firebase belum dikonfigurasi';render()}
setInterval(tick,1000);setInterval(renderKajian,60000);tick();
</script></body></html>
